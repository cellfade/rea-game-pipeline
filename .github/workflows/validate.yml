name: Validate pipeline package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/check_package.py
      - run: python harness/pipeline.py validate examples/planning.json
      - run: python harness/pipeline.py audit examples/audited-fixture.json --level reference
      - run: python scripts/publication_check.py
